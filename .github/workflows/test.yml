name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Tcl
        run: sudo apt-get update && sudo apt-get install -y tcl
      - name: Show Tcl version
        run: tclsh <<< 'puts [info patchlevel]'
      - name: Run EduTcl tests
        run: tclsh tests/run.tcl
